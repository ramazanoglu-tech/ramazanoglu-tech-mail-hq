<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mail HQ — Ramazanoğlu Tech</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RT Mail HQ">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Compiled from src.css by `npm run build:css` (no runtime CDN: the CSP allows only same-origin scripts) -->
  <link rel="stylesheet" href="./tailwind.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body class="font-sans selection:bg-ink selection:text-paper h-full overflow-hidden flex flex-col">

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-16 opacity-0 transition-all duration-200 pointer-events-none" role="status" aria-live="polite">
    <div class="bg-ink text-paper px-5 py-3.5 hairline-box flex items-center gap-3">
      <span id="toast-dot" class="w-2 h-2 bg-intlOrange inline-block"></span>
      <span id="toast-text" class="font-mono text-xs uppercase tracking-wider"></span>
    </div>
  </div>

  <!-- ================================================================= -->
  <!-- HEADER                                                            -->
  <!-- ================================================================= -->
  <header class="h-14 sm:h-16 bg-paper hairline-b flex-shrink-0 z-30">
    <div class="h-full grid grid-cols-12 items-center">

      <div class="col-span-5 sm:col-span-4 lg:col-span-2 px-4 sm:px-5 h-full flex items-center justify-between hairline-r">
        <a href="https://ramazanoglu.tech" class="inline-flex items-baseline gap-2 focus:outline-none">
          <span class="text-xs sm:text-sm font-bold tracking-tight uppercase text-ink">RAMAZANOĞLU</span>
          <span class="w-1.5 h-1.5 bg-intlOrange inline-block"></span>
        </a>
        <span class="hidden sm:inline-block font-mono text-[10px] uppercase tracking-widest px-1.5 py-0.5 hairline-box bg-paperMuted text-slateMuted">HQ</span>
      </div>

      <div class="hidden lg:flex lg:col-span-4 h-full items-center px-4 hairline-r bg-paper">
        <span class="font-mono text-xs text-slateLight mr-3">/</span>
        <input id="searchInput" type="search" autocomplete="off"
          placeholder="E-postalarda, göndericilerde veya konularda ara..."
          class="w-full bg-transparent text-sm text-ink placeholder-slateLight focus:outline-none">
        <kbd class="hidden xl:inline-block font-mono text-[10px] text-slateLight px-1.5 py-0.5 hairline-box">ESC</kbd>
      </div>

      <div class="col-span-7 sm:col-span-8 lg:col-span-6 h-full flex items-center justify-end lg:justify-between px-3 sm:px-5 gap-3">
        <div class="hidden sm:flex items-center gap-2 font-mono text-[11px] text-slateMuted">
          <span id="syncDot" class="w-2 h-2 bg-slateLight inline-block"></span>
          <span id="statusPill">BAĞLANIYOR...</span>
        </div>

        <div class="flex items-center gap-2">
          <span id="userBadge" class="hidden md:inline-block font-mono text-xs text-ink px-3 py-1.5 bg-paperMuted hairline-box max-w-[240px] truncate" hidden></span>
          <a id="adminLink" href="./admin.html"
            class="px-3 py-2 font-mono text-xs uppercase tracking-wider hairline-box bg-paper text-ink hover:bg-paperMuted transition-colors">
            HESAP
          </a>
          <button id="btnLogout" type="button" title="Çıkış Yap" aria-label="Çıkış Yap"
            class="px-3 py-2 font-mono text-xs uppercase tracking-wider hairline-box bg-paper text-slateMuted hover:text-intlOrange hover:bg-paperMuted transition-colors">
            ×
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- ================================================================= -->
  <!-- WORKSPACE: nav rail | message stream | reader                     -->
  <!-- ================================================================= -->
  <main class="flex-grow min-h-0 flex flex-col lg:grid lg:grid-cols-12 overflow-hidden bg-paper">

    <!-- NAV RAIL -->
    <aside class="lg:col-span-2 hairline-b lg:border-b-0 lg:hairline-r flex flex-col justify-between bg-paper lg:overflow-y-auto flex-shrink-0">
      <div>
        <div class="p-3 lg:p-4 lg:hairline-b flex items-center gap-3">
          <button id="btnOpenCompose" type="button"
            class="flex-shrink-0 lg:w-full bg-ink text-paper py-3 lg:py-3.5 px-4 font-mono text-xs uppercase tracking-wider hover:bg-neutral-800 transition-colors flex items-center justify-between gap-3">
            <span>+ YENİ E-POSTA</span>
            <kbd class="hidden lg:inline text-[10px] opacity-75 font-mono">C</kbd>
          </button>
          <select id="mobileChannel" aria-label="Kimlik filtresi"
            class="lg:hidden flex-grow min-w-0 px-3 py-3 bg-paper hairline-box font-mono text-xs text-ink focus:outline-none"></select>
        </div>

        <div class="lg:py-3">
          <div class="hidden lg:block px-5 py-2 font-mono text-[10px] uppercase tracking-widest text-slateLight">KLASÖRLER</div>
          <nav id="folderNav" class="flex lg:block overflow-x-auto font-sans text-sm" aria-label="Klasörler">
            <button type="button" data-folder="INBOX" class="folder-btn flex-shrink-0 lg:w-full px-5 py-3 flex items-center justify-between gap-6 text-left font-medium nav-active transition-colors">
              <span>Gelen Kutusu</span><span id="badge-inbox" class="font-mono text-xs"></span>
            </button>
            <button type="button" data-folder="OUTBOUND" class="folder-btn flex-shrink-0 lg:w-full px-5 py-3 flex items-center justify-between gap-6 text-left text-slateMuted hover:bg-paperMuted hover:text-ink transition-colors">
              <span>Gönderilenler</span><span id="badge-sent" class="font-mono text-xs text-slateLight"></span>
            </button>
            <button type="button" data-folder="STARRED" class="folder-btn flex-shrink-0 lg:w-full px-5 py-3 flex items-center justify-between gap-6 text-left text-slateMuted hover:bg-paperMuted hover:text-ink transition-colors">
              <span>Yıldızlı</span><span class="font-mono text-xs text-slateLight"></span>
            </button>
            <button type="button" data-folder="ARCHIVE" class="folder-btn flex-shrink-0 lg:w-full px-5 py-3 flex items-center justify-between gap-6 text-left text-slateMuted hover:bg-paperMuted hover:text-ink transition-colors">
              <span>Arşiv</span><span class="font-mono text-xs text-slateLight"></span>
            </button>
          </nav>
        </div>

        <div class="hidden lg:block py-3 hairline-t">
          <div class="px-5 py-2 font-mono text-[10px] uppercase tracking-widest text-slateLight">KİMLİKLER</div>
          <div id="channelList" class="px-2 pb-2 font-mono text-xs text-slateMuted"></div>
        </div>
      </div>

      <div class="hidden lg:block p-5 hairline-t bg-paperMuted/40">
        <div class="font-mono text-[10px] uppercase tracking-widest text-slateLight mb-2.5">KISAYOLLAR</div>
        <div class="space-y-1.5 font-mono text-[11px] text-slateMuted">
          <div class="flex justify-between"><span>Yeni E-posta</span><span class="text-ink">C</span></div>
          <div class="flex justify-between"><span>Hızlı Yanıtla</span><span class="text-ink">R</span></div>
          <div class="flex justify-between"><span>Arama</span><span class="text-ink">/</span></div>
        </div>
      </div>
    </aside>

    <!-- MESSAGE STREAM -->
    <section class="lg:col-span-4 lg:hairline-r flex flex-col flex-grow min-h-0 overflow-hidden bg-paper">
      <div class="lg:hidden px-4 py-2.5 hairline-b bg-paper">
        <input id="searchInputMobile" type="search" autocomplete="off" placeholder="E-postalarda ara..."
          class="w-full px-3 py-2.5 bg-surface hairline-box text-base text-ink placeholder-slateLight focus:outline-none focus:border-ink">
      </div>
      <div class="px-5 py-3 hairline-b bg-paperMuted/50 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-4">
          <button type="button" id="filter-all" data-read="ALL" class="read-filter font-mono text-xs uppercase tracking-wider font-semibold text-ink underline underline-offset-4">TÜMÜ</button>
          <button type="button" id="filter-unread" data-read="UNREAD" class="read-filter font-mono text-xs uppercase tracking-wider text-slateMuted hover:text-ink">OKUNMAMIŞ</button>
        </div>
        <div class="flex items-center gap-3">
          <span id="emailCountLabel" class="font-mono text-[11px] text-slateLight"></span>
          <button type="button" id="btnRefresh" class="font-mono text-[11px] uppercase tracking-wider text-slateMuted hover:text-ink">YENİLE ↻</button>
        </div>
      </div>
      <div id="emailList" class="flex-grow overflow-y-auto divide-y divide-[#E2E2DF]" role="list"></div>
      <div class="px-5 py-2 hairline-t flex-shrink-0 hidden" id="devBar">
        <button type="button" id="btnSimulate" class="font-mono text-[10px] uppercase text-slateLight hover:text-ink">[SİMÜLE ET: TEST MAİLİ]</button>
      </div>
    </section>

    <!-- READER (full-screen sheet on phones, third pane on desktop) -->
    <section id="readerPane" class="hidden lg:flex fixed lg:static inset-0 z-30 lg:z-auto lg:col-span-6 flex-col lg:h-full overflow-hidden bg-surface">

      <div class="px-4 sm:px-6 py-3 hairline-b bg-paper flex items-center justify-between flex-shrink-0 gap-2 flex-wrap">
        <div class="flex items-center gap-2 flex-wrap">
          <button type="button" id="btnBack" class="lg:hidden px-3 py-1.5 hairline-box bg-surface font-mono text-xs uppercase tracking-wider text-ink">← GERİ</button>
          <button type="button" id="btnReply" class="px-3.5 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-ink transition-colors">↩ YANITLA</button>
          <button type="button" id="btnForward" class="px-3.5 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-slateMuted hover:text-ink transition-colors">→ İLET</button>
          <button type="button" id="btnCopySender" class="hidden sm:inline-block px-3.5 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-slateMuted hover:text-ink transition-colors">ADRESİ KOPYALA</button>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="btnToggleStar" class="px-3 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-slateMuted hover:text-ink transition-colors">☆</button>
          <button type="button" id="btnToggleRead" class="hidden sm:inline-block px-3 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-slateMuted hover:text-ink transition-colors">OKUNMADI</button>
          <button type="button" id="btnArchive" class="px-3 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-slateMuted hover:text-ink transition-colors">ARŞİVLE</button>
          <button type="button" id="btnDeleteEmail" class="px-3 py-1.5 hairline-box bg-surface hover:bg-paperMuted font-mono text-xs uppercase tracking-wider text-intlOrange transition-colors">SİL</button>
        </div>
      </div>

      <div id="reader-content" class="flex-grow overflow-y-auto px-5 sm:px-10 py-8"></div>

      <div id="quick-reply-box" class="hairline-t bg-paper p-4 sm:px-8 sm:py-5 flex-shrink-0">
        <div class="flex items-center justify-between mb-2 gap-3 flex-wrap">
          <span class="font-mono text-[11px] uppercase tracking-wider text-slateMuted">
            HIZLI YANIT → <span id="reply-to-label" class="text-ink font-medium"></span>
          </span>
          <span class="flex items-center gap-2">
            <label for="replyFromSelect" class="font-mono text-[11px] uppercase text-slateLight">GÖNDEREN</label>
            <select id="replyFromSelect" class="max-w-[220px] px-2 py-1 bg-surface hairline-box font-mono text-[11px] text-ink focus:outline-none"></select>
          </span>
        </div>
        <div class="flex flex-col sm:flex-row gap-3">
          <textarea id="quick-reply-input" rows="2"
            placeholder="Yanıtınızı buraya yazın (Göndermek için Ctrl+Enter)..."
            class="flex-grow p-3 bg-surface hairline-box text-base sm:text-sm text-ink placeholder-slateLight focus:outline-none focus:border-ink resize-none leading-relaxed"></textarea>
          <div class="flex sm:flex-col gap-2 self-end sm:self-stretch">
            <button type="button" id="btnFullEditor" class="px-4 py-2 hairline-box bg-paper font-mono text-[11px] uppercase text-slateMuted hover:text-ink">EDİTÖR ↗</button>
            <button type="button" id="btnSendQuickReply"
              class="flex-grow bg-ink text-paper px-6 py-3 font-mono text-xs uppercase tracking-widest hover:bg-neutral-800 transition-colors flex items-center justify-center gap-2">
              <span>GÖNDER</span><span>→</span>
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ================================================================= -->
  <!-- COMPOSE MODAL                                                     -->
  <!-- ================================================================= -->
  <div id="composeModal" class="hidden fixed inset-0 z-50 bg-ink/40 flex items-center justify-center p-3 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
    <div class="bg-surface hairline-box w-full max-w-2xl flex flex-col max-h-[92vh]">
      <div class="px-5 sm:px-6 py-4 hairline-b bg-paperMuted flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 bg-intlOrange inline-block"></span>
          <span id="composeTitle" class="font-mono text-xs uppercase tracking-widest text-ink font-medium">YENİ KURUMSAL İLETİ</span>
        </div>
        <button type="button" id="btnCloseCompose" aria-label="Kapat" class="font-mono text-sm text-slateMuted hover:text-ink px-2">✕</button>
      </div>

      <div class="p-5 sm:p-6 space-y-4 overflow-y-auto flex-grow">
        <div class="grid grid-cols-12 items-center hairline-b pb-3 gap-y-1">
          <label for="composeFromSelect" class="col-span-12 sm:col-span-2 font-mono text-[11px] uppercase tracking-wider text-slateLight">GÖNDEREN</label>
          <select id="composeFromSelect" class="col-span-12 sm:col-span-10 bg-transparent font-mono text-xs text-ink focus:outline-none"></select>
        </div>
        <div class="grid grid-cols-12 items-center hairline-b pb-3 gap-y-1">
          <label for="composeToInput" class="col-span-12 sm:col-span-2 font-mono text-[11px] uppercase tracking-wider text-slateLight">ALICI</label>
          <input id="composeToInput" type="text" autocomplete="off" placeholder="alici@kurum.com, diger@sirket.ch"
            class="col-span-12 sm:col-span-10 bg-transparent text-base sm:text-sm font-mono text-ink focus:outline-none">
        </div>
        <div class="grid grid-cols-12 items-center hairline-b pb-3 gap-y-1">
          <label for="composeCcInput" class="col-span-12 sm:col-span-2 font-mono text-[11px] uppercase tracking-wider text-slateLight">CC</label>
          <input id="composeCcInput" type="text" autocomplete="off" placeholder="İsteğe bağlı"
            class="col-span-12 sm:col-span-10 bg-transparent text-base sm:text-sm font-mono text-ink focus:outline-none">
        </div>
        <div class="grid grid-cols-12 items-center hairline-b pb-3 gap-y-1">
          <label for="composeTemplateSelect" class="col-span-12 sm:col-span-2 font-mono text-[11px] uppercase tracking-wider text-slateLight">ŞABLON</label>
          <select id="composeTemplateSelect" class="col-span-12 sm:col-span-10 bg-transparent font-mono text-xs text-ink focus:outline-none">
            <option value="">— Şablon (isteğe bağlı) —</option>
          </select>
        </div>
        <div class="grid grid-cols-12 items-center hairline-b pb-3 gap-y-1">
          <label for="composeSubjectInput" class="col-span-12 sm:col-span-2 font-mono text-[11px] uppercase tracking-wider text-slateLight">KONU</label>
          <input id="composeSubjectInput" type="text" autocomplete="off" placeholder="İleti konusu..."
            class="col-span-12 sm:col-span-10 bg-transparent text-base sm:text-sm font-medium text-ink focus:outline-none">
        </div>
        <textarea id="composeBodyInput" rows="9" placeholder="İletinizi buraya yazın..."
          class="w-full p-3 bg-paper hairline-box text-base sm:text-sm text-ink leading-relaxed focus:outline-none focus:border-ink resize-y"></textarea>
        <div>
          <div class="font-mono text-[11px] uppercase tracking-wider text-slateLight mb-2">İMZA ÖNİZLEMESİ</div>
          <div id="composeSignaturePreview" class="bg-paperMuted hairline-box p-3 text-xs"></div>
        </div>
      </div>

      <div class="px-5 sm:px-6 py-4 hairline-t flex items-center justify-between gap-3">
        <span class="hidden sm:inline font-mono text-[11px] text-slateLight">SMTP // TLS RELAY</span>
        <div class="flex items-center gap-3 ml-auto">
          <button type="button" id="btnCancelCompose" class="px-5 py-3 hairline-box bg-paper text-slateMuted hover:text-ink font-mono text-xs uppercase tracking-wider">İPTAL</button>
          <button type="button" id="btnDispatchSend" class="px-6 py-3 bg-ink text-paper hover:bg-neutral-800 font-mono text-xs uppercase tracking-widest flex items-center gap-3">
            <span>GÖNDER</span><span>→</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="./auth.js"></script>
  <script src="./app.js"></script>
</body>
</html>
