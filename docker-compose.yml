# =============================================================================
# RAMAZANOĞLU TECH MAIL HQ - DOCKER COMPOSE
# All secrets come from a .env file next to this file (NEVER commit it):
#   cp cloud-backend/.env.example .env   and fill in real values
# =============================================================================

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    container_name: ramazanoglu_postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ramazanoglu_mail_db}
    # No published port: only the backend container can reach the database.
    # For local debugging use:  docker compose exec postgres psql -U mailhq
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cloud-backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailhq} -d ${POSTGRES_DB:-ramazanoglu_mail_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: cloud-backend/Dockerfile
    container_name: ramazanoglu_cloud_backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to localhost on purpose: expose it to the internet only through an HTTPS
    # front (Cloudflare Tunnel / Caddy / nginx) that proxies to 127.0.0.1:8765.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      NODE_ENV: production
      PORT: 8765
      HOST: "0.0.0.0"
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailhq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ramazanoglu_mail_db}
      DATABASE_SSL: "false"   # internal docker network, no TLS between the containers
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env}
      OWNER_EMAIL: ${OWNER_EMAIL:-yusuf@ramazanoglu.tech}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:-}
      OWNER_NAME: ${OWNER_NAME:-Yusuf Ramazanoğlu}
      LEGACY_API_KEY_ENABLED: ${LEGACY_API_KEY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DOMAIN_FILTER: "@ramazanoglu.tech"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MOCK_MODE: "false"

  # Optional HTTPS front: docker compose --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env (Cloudflare Zero Trust > Networks > Tunnels).
  # In the tunnel's Public Hostname set the service to  http://backend:8765
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ramazanoglu_tunnel
    restart: unless-stopped
    logging: *logging
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend

  # ---- Company tools (optional): docker compose --profile tunnel --profile tools up -d
  # Add Public Hostnames to the same tunnel (Zero Trust > Networks > Tunnels):
  #   status.ramazanoglu.tech -> http://uptime-kuma:3001
  #   vault.ramazanoglu.tech  -> http://vaultwarden:80
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ramazanoglu_uptime_kuma
    restart: unless-stopped
    logging: *logging
    profiles: ["tools"]
    mem_limit: 300m
    volumes:
      - kumadata:/app/data

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: ramazanoglu_vaultwarden
    restart: unless-stopped
    logging: *logging
    profiles: ["tools"]
    mem_limit: 200m
    environment:
      DOMAIN: https://vault.ramazanoglu.tech
      # Leave true only while creating the first accounts, then set false in .env and recreate.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      INVITATIONS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}   # empty = admin page disabled
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vwdata:/data

volumes:
  pgdata:
  kumadata:
  vwdata:
