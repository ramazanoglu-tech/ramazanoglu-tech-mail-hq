name: Deploy

# Every merge to main is tested, then deployed to the production server through AWS SSM
# (no SSH port, no stored keys: GitHub proves its identity to AWS with OIDC).

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    # Stays off until the AWS side is set up (docs/ops-setup.md): create the repository variable DEPLOY_ENABLED=true
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run scripts/deploy.sh on the server
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          remote='cd /home/ubuntu/ramazanoglu-tech-mail-hq && bash scripts/ops.sh deploy'
          params="$(jq -cn --arg c "sudo -u ubuntu -H bash -lc '$remote'" '{commands: [$c]}')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "::add-mask::$cmd_id"
          status=InProgress
          for _ in $(seq 1 90); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$status" != "Success" ]; then
            echo "Deploy finished with status: $status" >&2
            aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text >&2 || true
            exit 1
          fi
