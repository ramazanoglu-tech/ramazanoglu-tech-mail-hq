name: Ops

# Remote server operations from a GitHub issue comment, owner only:
#   /ops status | disk | backup | deploy | security-updates
#   /ops logs <service> | restart <service> | staging <branch>
# Only these commands exist; nothing else can reach the server. Results are posted as a reply.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  run:
    name: ops command
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/ops ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Parse and validate the command
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          line="$(printf '%s' "$BODY" | head -n1 | tr -d '\r')"
          if [[ "$line" =~ ^/ops\ (status|disk|backup|deploy|security-updates)$ ]] \
             || [[ "$line" =~ ^/ops\ (logs|restart)\ (backend|postgres|cloudflared|uptime-kuma|vaultwarden)$ ]] \
             || [[ "$line" =~ ^/ops\ staging\ ([A-Za-z0-9._/-]{1,80})$ ]]; then
            echo "args=${line#/ops }" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown or malformed command" >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Execute on the server
        id: exec
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          ARGS: ${{ steps.parse.outputs.args }}
        run: |
          set -euo pipefail
          remote="cd /home/ubuntu/ramazanoglu-tech-mail-hq && bash scripts/ops.sh $ARGS"
          params="$(jq -cn --arg c "sudo -u ubuntu -H bash -lc '$remote'" '{commands: [$c]}')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "::add-mask::$cmd_id"
          status=InProgress
          for _ in $(seq 1 90); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          {
            echo "status=$status"
            echo "out<<EOF_OUT"
            aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tail -c 20000
            aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text | tail -c 4000
            echo "EOF_OUT"
          } >> "$GITHUB_OUTPUT"
      - name: Reply with the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PRIVATE: ${{ github.event.repository.private }}
          CMD: ${{ steps.parse.outputs.args }}
          STATUS: ${{ steps.exec.outputs.status }}
          OUT: ${{ steps.exec.outputs.out }}
        run: |
          set -euo pipefail
          # Logs can contain customer mail subjects: never write them into a public repository.
          if [ "$PRIVATE" != "true" ] && [[ "$CMD" == logs* ]]; then
            OUT="(Logs are hidden because this repository is public. Make it private to see them here.)"
          fi
          {
            echo "**/ops $CMD** → \`${STATUS:-failed}\`"
            echo
            echo '```'
            printf '%s\n' "${OUT:-no output}"
            echo '```'
          } > reply.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file reply.md
